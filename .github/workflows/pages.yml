name: Publish Emeem to the web

# Builds the game and serves it from GitHub Pages, which gives a plain public
# URL that any phone can open with no login and nothing to install:
#
#   https://slipknotmet-ship-it.github.io/wembley-wake-word/
#
# Run it from the Actions tab, or let it fire on any push that touches the game.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'emeem/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emeem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: emeem/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Pages serves from a subpath (/wembley-wake-word/), which is exactly why
      # vite.config.js sets base to './' - absolute asset URLs would 404 there.
      # No `enablement: true` here. Creating a Pages site for the first time
      # needs admin rights, and GITHUB_TOKEN does not have them - it fails with
      # "Resource not accessible by integration". Pages has to be switched on
      # once by hand: Settings -> Pages -> Source: GitHub Actions. After that
      # this workflow deploys on its own forever.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: emeem/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
