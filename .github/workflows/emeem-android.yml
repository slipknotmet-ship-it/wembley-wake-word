name: Build Emeem APK

# Builds an installable Android APK for the Emeem game.
# Run it from the Actions tab ("Run workflow"), then download the APK from the
# run's Artifacts section and open it on the phone. Android will ask you to
# allow installing from unknown sources the first time.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'emeem/**'
      - '.github/workflows/emeem-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emeem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: emeem/package-lock.json

      # Capacitor 7's Android Gradle Plugin needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle
        run: npm run build

      - name: Verify the game actually runs
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node tools/smoke.mjs --url http://127.0.0.1:4173/

      - name: Upload playtest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emeem-screenshots
          path: emeem/shots/

      - name: Sync the web bundle into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: emeem/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emeem-debug-apk
          path: emeem/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
