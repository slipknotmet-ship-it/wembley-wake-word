<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0510" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Emeem</title>
<style>
  :root {
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0b0510; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* The UI layer is click-through except for its own interactive children. */
  #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #ui-root > * { pointer-events: auto; }
  /* Nudge to turn the phone sideways; the game is landscape-only. */
  #rotate-nag {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: #0b0510; font-size: 20px; letter-spacing: 0.02em; padding: 24px;
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate-nag { display: flex; }
  }
  #rotate-nag .icon { font-size: 44px; display: block; margin-bottom: 14px; }
</style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-root"></div>
  <div id="rotate-nag"><div><span class="icon">📱↻</span>Rotate your phone sideways<br /><small style="opacity:.6">Emeem is played in landscape</small></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
